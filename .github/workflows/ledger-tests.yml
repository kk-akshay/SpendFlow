name: Ledger regression checks
on:
  push:
    branches: [master, feature/password-recovery]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "requirements.txt"
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt httpx
      - run: python tests/ledger_test.py
      - run: python tests/spendflow_test.py
      - run: python tests/people_loans_test.py
      - run: python tests/password_recovery_test.py
      - run: python tests/settings_selector_test.py
      - run: python tests/people_selector_test.py
      - run: python tests/monochrome_ui_test.py
      - run: python tests/mobile_shell_test.py
      - run: python tests/mobile_router_test.py
      - run: python tests/make_samples.py tests/samples
      - run: python tests/background_import_test.py
      - run: python tests/payee_names_test.py
      - run: python tests/credit_cards_test.py
      - run: python tests/test_credit_card_parser.py
      - run: python tests/api_test.py tests/samples
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/shell.js && node --check frontend/app.js && node --check frontend/pages.js && node --check frontend/review.js && node --check frontend/people.js
