name: Ledger regression checks
on:
  push:
    branches: [feature/spendflow-transactions]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "requirements.txt"
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt httpx
      - run: python tests/ledger_test.py
      - run: python tests/make_samples.py tests/samples
      - run: python tests/api_test.py tests/samples
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/app.js && node --check frontend/pages.js && node --check frontend/review.js
